name: Discovery scrape (12h)

on:
  schedule:
    # Every 12 hours at 00:00 and 12:00 UTC
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run discovery refresh (scrape → analyze → validate → notify)
        run: npm run discovery:refresh -w discovery-pipeline -- --notify
        env:
          MVP_APP_URL: ${{ vars.MVP_APP_URL }}
          NEXT_PUBLIC_APP_URL: ${{ vars.MVP_APP_URL }}
          N8N_WEBHOOK_SECRET: ${{ secrets.N8N_WEBHOOK_SECRET }}

      - name: Commit updated discovery data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/discovery/
          if git diff --staged --quiet; then
            echo "No discovery data changes"
          else
            git commit -m "chore(discovery): automated 12h scrape refresh"
            git push
          fi
