# Netlify — Smart Category Explorer (monorepo)
# Docs: https://docs.netlify.com/build/frameworks/framework-setup-guides/nextjs/overview/

[build]
  command = "bash scripts/netlify-build.sh"
  publish = "apps/mvp/.next"

[build.environment]
  NODE_VERSION = "20"
  # DATABASE_URL and DIRECT_URL — set in Netlify UI (Neon/Supabase)
  # Ensure build-time plugins and Prisma/TS tooling install in CI
  NPM_CONFIG_PRODUCTION = "false"

[[plugins]]
  package = "@netlify/plugin-nextjs"
